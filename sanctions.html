<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi des sanctions — CI6 Connect</title>
<style>
:root{--gold:#d6ad4b;--gold2:#f4d77a;--bg:#090b0d;--panel:#15191d;--line:#3b3527;--text:#f1f1f1;--muted:#b8b8b8;--danger:#8e3333}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07090a,#111417);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.top h1{margin:0;color:var(--gold2)}a,.btn{border:1px solid var(--gold2);background:linear-gradient(135deg,var(--gold2),#b88318);color:#090a0b;text-decoration:none;font-weight:800;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.secondary{background:#20252a;color:var(--text);border-color:#777}.btn.danger{background:var(--danger);color:#fff;border-color:#d27777}.panel{background:rgba(21,25,29,.96);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #555;background:#0d1013;color:#fff}textarea{min-height:90px}.results button{width:100%;text-align:left;padding:12px;background:#11161a;color:#fff;border:1px solid #3a4147;border-radius:8px;margin-top:7px;cursor:pointer}.student-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.student-head h2{margin:0;color:var(--gold2)}.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.count{background:#0e1215;border:1px solid #3a4147;border-radius:10px;padding:12px;text-align:center}.count strong{display:block;font-size:24px;color:var(--gold2)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.list{display:grid;gap:10px}.item{border:1px solid #3b4147;border-radius:10px;background:#0d1114}.item summary{cursor:pointer;padding:13px;font-weight:700}.item-body{padding:0 13px 13px;color:#ddd}.meta{color:var(--muted);font-size:14px}.message{margin-top:12px;font-weight:700}.ok{color:#77d693}.error{color:#ff8c8c}[hidden]{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}.top,.student-head{display:block}.top a{display:inline-block;margin-top:12px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div style="color:#aaa">ESPACE CADRES</div><h1>Suivi des sanctions</h1></div><a href="/#espace-cadres">Retour à l’espace cadres</a></div>
<section class="panel"><div class="student-head"><div style="flex:1"><label for="search">Rechercher un élève par identifiant, nom, prénom ou peloton</label><input id="search" autocomplete="off" placeholder="Ex. KRM482, DUPONT ou P2"><div id="results" class="results"></div></div><div class="actions"><button id="exportCompany" class="btn secondary" type="button">Exporter la compagnie</button></div></div></section>
<section id="studentPanel" class="panel" hidden>
<div class="student-head"><div><h2 id="studentName"></h2><div id="studentMeta" class="meta"></div></div><div class="actions"><button id="exportStudent" class="btn secondary">Exporter cet élève</button></div></div>
<div id="counts" class="counts"></div>
<form id="sanctionForm" class="grid">
<input type="hidden" id="editId">
<div><label>Type</label><select id="type" required><option value="rappel_verbal">Rappel verbal</option><option value="compte_rendu_ecrit">Compte rendu écrit</option><option value="lettre_observation">Lettre d’observation</option><option value="tours_consigne">Tours de consigne</option><option value="jours_arret">Jours d’arrêt</option></select></div>
<div><label>Nombre</label><input id="quantity" type="number" min="1" max="365" value="1"></div>
<div><label>Date et heure</label><input id="date" type="datetime-local" required></div>
<div><label>Motif courant</label><select id="reason"><option value="retard">Retard</option><option value="absence_injustifiee">Absence injustifiée</option><option value="tenue_non_conforme">Tenue non conforme</option><option value="non_respect_reglement_interieur">Non-respect du règlement intérieur</option><option value="travail_insuffisant">Travail insuffisant</option><option value="usage_telephone_hors_cas_prevus">Usage du téléphone hors des cas prévus</option><option value="defaut_compte_rendu_fait_mineur">Défaut de compte rendu — fait mineur</option><option value="defaut_compte_rendu_fait_important">Défaut de compte rendu — fait important</option><option value="arme_materiel_sensible_sans_surveillance">Arme ou matériel sensible laissé sans surveillance</option><option value="manquement_regles_securite">Manquement aux règles de sécurité</option><option value="defaut_loyaute_manque_respect">Défaut de loyauté ou manque de respect</option><option value="degradation_defaut_entretien_materiel">Dégradation ou défaut d’entretien du matériel</option><option value="autre">Autre motif</option></select></div>
<div class="wide" id="freeWrap" hidden><label>Autre motif</label><input id="reasonFree" maxlength="250"></div>
<div class="wide"><label>Observations détaillées</label><textarea id="observations" maxlength="3000"></textarea></div>
<div class="wide actions"><button class="btn" type="submit" id="save">Enregistrer la sanction</button><button class="btn secondary" type="button" id="cancelEdit" hidden>Annuler la modification</button></div>
</form><div id="message" class="message"></div>
<h3>Historique de l’élève</h3><div id="sanctions" class="list"></div>
</section>
</main>
<script>
const labels={rappel_verbal:"Rappel verbal",compte_rendu_ecrit:"Compte rendu écrit",lettre_observation:"Lettre d’observation",tours_consigne:"Tours de consigne",jours_arret:"Jours d’arrêt"};
const reasonLabels={retard:"Retard",absence_injustifiee:"Absence injustifiée",tenue_non_conforme:"Tenue non conforme",non_respect_reglement_interieur:"Non-respect du règlement intérieur",travail_insuffisant:"Travail insuffisant",usage_telephone_hors_cas_prevus:"Usage du téléphone hors des cas prévus",defaut_compte_rendu_fait_mineur:"Défaut de compte rendu — fait mineur",defaut_compte_rendu_fait_important:"Défaut de compte rendu — fait important",arme_materiel_sensible_sans_surveillance:"Arme ou matériel sensible laissé sans surveillance",manquement_regles_securite:"Manquement aux règles de sécurité",defaut_loyaute_manque_respect:"Défaut de loyauté ou manque de respect",degradation_defaut_entretien_materiel:"Dégradation ou défaut d’entretien du matériel",autre:"Autre motif",comportement_inadapte:"Comportement inadapté",manquement_discipline:"Manquement à la discipline",non_respect_consigne:"Non-respect d’une consigne",defaut_compte_rendu:"Défaut de compte rendu",manquement_securite:"Manquement à la sécurité",materiel:"Dégradation ou mauvais entretien du matériel"};
let selected=null,current=[]; const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function localValue(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)} $('date').value=localValue();
$('reason').onchange=()=>{$('freeWrap').hidden=$('reason').value!=="autre"};
let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(searchStudents,250)};
async function searchStudents(){const q=$('search').value.trim();if(!q){$('results').innerHTML="";return}const r=await fetch('/cadres/discipline?action=search&q='+encodeURIComponent(q));const d=await r.json();$('results').innerHTML=(d.students||[]).map(s=>`<button data-n="${s.nigend}"><strong>${esc(s.nom)} ${esc(s.prenom)}</strong><br><span class="meta">Identifiant ${esc(s.nigend)} — Peloton ${esc(s.peloton)}${s.promotion?' — '+esc(s.promotion):''}</span></button>`).join('')||'<div class="meta">Aucun élève trouvé.</div>';$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>loadStudent(b.dataset.n));}
async function loadStudent(n){const r=await fetch('/cadres/discipline?action=student&nigend='+encodeURIComponent(n));const d=await r.json();if(!r.ok)return alert(d.error||'Erreur');selected=d.student;current=d.sanctions||[];$('studentPanel').hidden=false;$('studentName').textContent=`${selected.nom} ${selected.prenom||''}`.trim();$('studentMeta').textContent=`Identifiant ${selected.nigend} — Peloton ${selected.peloton}${selected.promotion?' — '+selected.promotion:''}`;renderCounts(d.counts||[]);renderList();$('results').innerHTML='';$('search').value='';}
function renderCounts(rows){const map=Object.fromEntries(rows.map(r=>[r.sanction_type,Number(r.quantity||r.entries||0)]));$('counts').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="count"><strong>${map[k]||0}</strong>${v}</div>`).join('')}
function renderList(){$('sanctions').innerHTML=current.map(s=>`<details class="item"><summary>${esc(labels[s.sanction_type])} — ${new Date(s.sanction_date).toLocaleString('fr-FR')} — ${esc(reasonLabels[s.reason_code]||s.reason_free||'Motif')}</summary><div class="item-body"><p><strong>Quantité :</strong> ${s.quantity}</p><p><strong>Motif :</strong> ${esc(s.reason_free||reasonLabels[s.reason_code]||'')}</p>${s.observations?`<p><strong>Observations :</strong><br>${esc(s.observations).replace(/\n/g,'<br>')}</p>`:''}<p class="meta">Saisi par ${esc(s.created_by)}${s.updated_by?' — modifié par '+esc(s.updated_by):''}</p><div class="actions"><button class="btn secondary" onclick="editSanction(${s.id})">Modifier</button><button class="btn danger" onclick="deleteSanction(${s.id})">Supprimer</button></div></div></details>`).join('')||'<p class="meta">Aucune sanction enregistrée.</p>'}
window.editSanction=id=>{const s=current.find(x=>x.id===id);if(!s)return;$('editId').value=id;$('type').value=s.sanction_type;$('quantity').value=s.quantity;$('date').value=localValue(new Date(s.sanction_date));$('reason').value=s.reason_code||'autre';$('reasonFree').value=s.reason_free||'';$('observations').value=s.observations||'';$('freeWrap').hidden=$('reason').value!=='autre';$('save').textContent='Enregistrer la modification';$('cancelEdit').hidden=false;window.scrollTo({top:$('sanctionForm').offsetTop-20,behavior:'smooth'})};
function resetForm(){$('sanctionForm').reset();$('editId').value='';$('quantity').value=1;$('date').value=localValue();$('freeWrap').hidden=true;$('save').textContent='Enregistrer la sanction';$('cancelEdit').hidden=true}$('cancelEdit').onclick=resetForm;
$('sanctionForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const id=$('editId').value;const body={student_nigend:selected.nigend,sanction_type:$('type').value,quantity:Number($('quantity').value||1),sanction_date:new Date($('date').value).toISOString(),reason_code:$('reason').value,reason_free:$('reason').value==='autre'?$('reasonFree').value.trim():'',observations:$('observations').value.trim()};const r=await fetch(id?'/cadres/discipline/'+id:'/cadres/discipline',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();$('message').className='message '+(r.ok?'ok':'error');$('message').textContent=r.ok?(id?'Sanction modifiée.':'Sanction enregistrée.'):(d.error||'Erreur');if(r.ok){resetForm();await loadStudent(selected.nigend)}};
window.deleteSanction=async id=>{if(!confirm('Supprimer cette sanction ? Cette action est réservée aux administrateurs.'))return;const r=await fetch('/cadres/discipline/'+id,{method:'DELETE'});const d=await r.json();if(!r.ok)return alert(d.error||'Erreur');await loadStudent(selected.nigend)};
function csvEscape(v){const x=String(v??'');return /[;"\r\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}function download(rows,name){const heads=['identifiant','nom','prenom','peloton','promotion','type','quantite','motif','observations','date','saisi_par'];const lines=[heads.join(';'),...rows.map(s=>[s.nigend||s.student_nigend,s.nom||selected?.nom,s.prenom||selected?.prenom,s.peloton||selected?.peloton,s.promotion||selected?.promotion,labels[s.sanction_type],s.quantity,s.reason_free||reasonLabels[s.reason_code]||'',s.observations,s.sanction_date,s.created_by].map(csvEscape).join(';'))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('exportStudent').onclick=()=>selected&&download(current,`sanctions-${selected.nigend}.csv`);$('exportCompany').onclick=async()=>{const r=await fetch('/cadres/discipline?action=company');const d=await r.json();if(!r.ok)return alert(d.error||'Erreur');download(d.rows||[],`sanctions-compagnie-${new Date().toISOString().slice(0,10)}.csv`)};
</script></body></html>
