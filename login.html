<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050607">
  <title>Connexion — CI6 Connect</title>

  <style>
    :root {
      --gold: #b88318;
      --gold-light: #f4d77a;
      --silver: #dfe3e8;
      --text: #f5f5f5;
      --muted: #bbb5aa;
      --panel: #080a0c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 78% 8%, rgba(214, 173, 58, 0.16), transparent 28rem),
        linear-gradient(135deg, #050607 0%, #12171b 48%, #030405 100%);
    }

    .login-card {
      position: relative;
      isolation: isolate;
      width: min(100%, 440px);
      overflow: hidden;
      padding: 48px 38px 38px;
      border: 1px solid rgba(214, 173, 58, 0.78);
      border-radius: 16px;
      background: rgba(7, 9, 11, 0.93);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.58);
    }
    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(7, 9, 11, 0.78),
          rgba(7, 9, 11, 0.88)
        ),
        url("assets/img/dragon-filigrane.png") center center / 72% no-repeat;
      opacity: 0.22;
      filter: drop-shadow(0 0 18px rgba(184, 131, 24, 0.22));
    }
    .login-card > * {
      position: relative;
      z-index: 1;
    }
    .origami-corner {
      position: absolute;
      top: 0;
      right: 0;
      width: 74px;
      height: 74px;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, #6d4808);
    }

    .brand {
      margin: 0;
      text-align: center;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--gold-light);
    }

    .brand span {
      color: var(--silver);
    }

    .subtitle {
      margin: 11px 0 6px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      line-height: 1.5;
    }

    .company {
      margin: 0 0 28px;
      text-align: center;
      color: var(--gold-light);
      font-size: 15px;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184, 131, 24, 0.85), transparent);
    }

    .separator span {
      color: var(--gold-light);
      font-size: 11px;
      transform: rotate(45deg);
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 49px;
      margin: 0 0 20px;
      padding: 0 14px;
      color: var(--text);
      font: inherit;
      border: 1px solid rgba(214, 173, 58, 0.72);
      border-radius: 8px;
      outline: none;
      background: #020304;
    }

    input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 3px rgba(214, 173, 58, 0.15);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      cursor: pointer;
      color: #090a0b;
      font: inherit;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:focus-visible {
      outline: 3px solid rgba(244, 215, 122, 0.45);
      outline-offset: 3px;
    }

    .error {
      margin: 0 0 20px;
      padding: 12px;
      color: #ffd9d9;
      text-align: center;
      font-size: 14px;
      border: 1px solid rgba(255, 90, 90, 0.55);
      border-radius: 8px;
      background: rgba(120, 20, 20, 0.28);
    }

    .notice {
      margin: 24px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    .motto {
      margin: 25px 0 0;
      color: var(--silver);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-style: italic;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 43px 24px 30px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="origami-corner" aria-hidden="true"></div>

    <h1 class="brand">CI6 <span>CONNECT</span></h1>
    <p class="subtitle">Guide numérique des consignes</p>
    <p class="company">6e compagnie d’instruction</p>

    <div class="separator" aria-hidden="true">
      <span>◆</span>
    </div>

    <p id="loginError" class="error" hidden>
      Identifiant ou mot de passe incorrect.
    </p>

    <form method="post" action="/login">
      <input type="hidden" name="next" id="nextPage" value="/">

      <label for="username">Identifiant</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        required
        autofocus
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Se connecter</button>
    </form>

    <p class="notice">
      Accès réservé aux personnels autorisés de la compagnie.
    </p>

    <p class="motto">
      « À cœur vaillant, rien d’impossible »
    </p>
  </main>

  <script>
    const parameters = new URLSearchParams(window.location.search);
    const destination = parameters.get("next");

    if (
      destination &&
      destination.startsWith("/") &&
      !destination.startsWith("//")
    ) {
      document.getElementById("nextPage").value = destination;
    }

    if (parameters.get("error") === "1") {
      document.getElementById("loginError").hidden = false;
    }
  </script>
</body>
</html>
