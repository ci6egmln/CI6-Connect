<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Changer le mot de passe — CI6 Connect</title>

  <style>
    :root {
      --gold: #b88318;
      --gold-light: #f4d77a;
      --silver: #dfe3e8;
      --text: #f5f5f5;
      --muted: #bbb5aa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 78% 8%,
          rgba(214, 173, 58, 0.16),
          transparent 28rem
        ),
        linear-gradient(
          135deg,
          #050607 0%,
          #12171b 48%,
          #030405 100%
        );
    }

    main {
      position: relative;
      width: min(100%, 460px);
      overflow: hidden;
      padding: 42px 36px 36px;
      border: 1px solid rgba(214, 173, 58, 0.8);
      border-radius: 16px;
      background: rgba(7, 9, 11, 0.97);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.58);
    }

    main::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 72px;
      height: 72px;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold) 55%,
          #6d4808
        );
    }

    h1 {
      margin: 0;
      color: var(--gold-light);
      text-align: center;
      font-size: 30px;
    }

    .intro {
      margin: 14px 0 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    .password-field {
      position: relative;
    }

    input {
      width: 100%;
      height: 49px;
      padding: 0 100px 0 14px;
      color: white;
      font: inherit;
      border: 1px solid rgba(214, 173, 58, 0.75);
      border-radius: 8px;
      outline: none;
      background: #020304;
    }

    input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 3px rgba(214, 173, 58, 0.14);
    }

    .show-password {
      position: absolute;
      top: 6px;
      right: 7px;
      width: auto;
      min-height: 37px;
      padding: 0 11px;
      color: var(--gold-light);
      cursor: pointer;
      font-weight: 700;
      border: 1px solid rgba(214, 173, 58, 0.55);
      border-radius: 6px;
      background: #111417;
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      margin-top: 28px;
      cursor: pointer;
      color: #090a0b;
      font: inherit;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 0;
      border-radius: 8px;
      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );
    }

    .message {
      margin: 0 0 20px;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
    }

    .error {
      color: #ffd9d9;
      border: 1px solid rgba(255, 90, 90, 0.55);
      background: rgba(120, 20, 20, 0.28);
    }

    .rules {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      main {
        padding: 40px 24px 30px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Nouveau mot de passe</h1>

    <p class="intro">
      Pour sécuriser votre compte, choisissez votre mot de passe personnel.
    </p>

    <p id="errorMessage" class="message error" hidden></p>

    <form method="post" action="/change-password">
      <label for="newPassword">Nouveau mot de passe</label>

      <div class="password-field">
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <button
          class="show-password"
          type="button"
          data-target="newPassword"
        >
          Afficher
        </button>
      </div>

      <label for="confirmation">Confirmer le mot de passe</label>

      <div class="password-field">
        <input
          id="confirmation"
          name="confirmation"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <button
          class="show-password"
          type="button"
          data-target="confirmation"
        >
          Afficher
        </button>
      </div>

      <button class="submit-button" type="submit">
        Enregistrer le mot de passe
      </button>
    </form>

    <p class="rules">
      Le mot de passe doit contenir au minimum 12 caractères.
      Évitez les informations faciles à deviner et ne réutilisez pas
      un mot de passe professionnel sensible.
    </p>
  </main>

  <script>
    const parameters = new URLSearchParams(window.location.search);
    const errorCode = parameters.get("error");
    const errorMessage = document.getElementById("errorMessage");

    const messages = {
      mismatch: "Les deux mots de passe ne correspondent pas.",
      length: "Le mot de passe doit contenir au moins 12 caractères.",
      session: "Votre session a expiré. Reconnectez-vous.",
      update: "Le mot de passe n’a pas pu être enregistré."
    };

    if (errorCode && messages[errorCode]) {
      errorMessage.textContent = messages[errorCode];
      errorMessage.hidden = false;
    }

    document.querySelectorAll(".show-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(
          button.dataset.target
        );

        const visible = input.type === "text";

        input.type = visible ? "password" : "text";
        button.textContent = visible ? "Afficher" : "Masquer";
        input.focus();
      });
    });
  </script>
</body>
</html>
